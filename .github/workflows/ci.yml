name: pkdummy-harness CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
  harness-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run harness
        run: make harness-check
  harness:
    runs-on: ubuntu-latest
    needs: harness-matrix
    if: always()
    steps:
      - name: Require every Python harness result
        env:
          HARNESS_RESULT: ${{ needs.harness-matrix.result }}
        run: test "$HARNESS_RESULT" = success
  windows-smoke:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PowerShell harness smoke
        shell: pwsh
        run: ./scripts/harness-check.ps1 -SkipExternalProbe
