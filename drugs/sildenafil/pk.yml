simulation_validity:
  source_correction_date: '2026-10-28'
  status: clinical_hold
  review_date: '2026-10-28'
  correction_notes:
  - The earlier CL of 18.195113489698564 L/h, inferred from V and a midpoint half-life,
    was replaced with the reported systemic CL of 41 L/h in EMA source_7.
  - The retained volume of 105 L was reclassified from apparent V/F to systemic Vss.
  - F and F1 were changed from the fixture choices of 0.44 and 1 to the reported
    mean absolute oral bioavailability of 0.41.
  reasons:
  - The reported Vss of 105 L is used as the one-compartment V. With systemic CL
    of 41 L/h, this approximation does not reproduce the reported terminal half-life
    range of 3–5 h. The selected 4 h midpoint remains a check-only fixture reference.
  - KA, lag, IIV and residual errors are generic fixture assumptions. The retained
    100 mg computational regimen has not been qualified against independent concentration-time
    data.
