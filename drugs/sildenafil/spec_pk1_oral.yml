version: 0.1
study:
  id: OSP_sildenafil
  title: Sildenafil (template from label/PopPK summary)
population:
  n: 100
  covariates:
    wt_kg:
      dist: lognormal
      median: 70.0
      cv: 0.25
      min: 40
      max: 120
regimen:
  route: oral
  units:
    dose: mg
  arms:
    A:
      n: 100
      dose_mg: 100
sampling:
  t_end_h: 72.0
  dt_h: 0.5
  include_t0: true
model:
  template: pk1_oral_ode
  units:
    conc: ng/mL
    mult: 1000
  theta:
    CL: 41.0
    V: 105.0
    KA: 1.2
    F1: 0.41
    ALAG1: 0.5
  notes:
  - 'Systemic CL/V parameterization: theta.F1 is the selected bioavailability; exposure is F*Dose/CL_systemic.'
  - 'Demo theta policy: CL and V are the independent simulation parameters for this 1-compartment fixture.
    t_half is checked downstream and is not used to recalibrate theta.'
  - Systemic CL41 L/h and Vss105 L are reported in EMA source_7. The previous CL18.195113489698564 L/h
    was inferred from V and a midpoint half-life and is superseded, not treated as a reported CL/F.
  - F1=0.41 is the reported mean absolute oral bioavailability. The terminal half-life4 h is only the
    midpoint of the reported3–5 h range; CL/Vss does not reproduce this terminal phase in a one-compartment
    model.
  - The retained100 mg oral dose is within the cited recommended-dose range, but Vss mapping, KA, lag,
    IIV and residual errors remain fixture approximations and do not establish clinical model validity.
iiv:
  eta:
    CL: 0.09
    V: 0.04
    KA: 0.16
  corr: false
residual:
  type: prop+add
  prop: 0.25
  add: 0.0
output:
  out_dir: outputs
  seed: 20260217
  write:
    raw_csv: true
    nonmem_csv: true
    summary_md: true
meta:
  sources:
  - https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=7086e222-0f2b-4c02-84c0-4f8635c90993
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC1874251/
  - https://www.accessdata.fda.gov/drugsatfda_docs/label/2007/020895s027lbl.pdf
  - https://en.wikipedia.org/wiki/Sildenafil
  - https://go.drugbank.com/drugs/DB00203
  - https://labeling.pfizer.com/ShowLabeling.aspx?id=14610
  - https://www.ema.europa.eu/en/documents/product-information/viagra-epar-product-information_en.pdf
  pk_summary_raw:
    half_life: 3-5 hours
    clearance: 41 L/h (total body clearance; EMA source_7 section5.2)
    volume: 105 L
    bioavailability: 41% (25-63%)
    elimination: Hepatic metabolism (mainly CYP3A4, minor CYP2C9); metabolites recovered predominantly
      in feces (~80%) and urine (~13%).
