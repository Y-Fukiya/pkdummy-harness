derived:
  ke_1_per_h: 0.12857142857142856
  CL_abs_L_per_h_at_70kg: 90.0
  V_abs_L_at_70kg: 700.0
  CL_apparent_L_per_h_at_70kg: 600.0
  V_apparent_L_at_70kg: 4666.666666666667
  CL_systemic_L_per_h_at_70kg: 90.0
  V_systemic_L_at_70kg: 700.0
  notes:
  - Apparent CL/V were derived as (systemic CL/V) / F.
  - 'Basis detected/selected: systemic (CL, V). Oral models typically use F1=bioavailability
    with systemic CL/V.'
  - 'Reminder: Oral labels often report apparent parameters (CL/F, V/F). IV labels
    typically report systemic parameters.'
value_provenance:
  CL_abs_L_per_h_at_70kg:
    source_id: source_2
    source_field: mean_total_clearance_from_blood
    value_basis: derived_from_reported
    raw_value: 1-1.5
    raw_unit: L/min
    normalized_value: 90.0
    normalized_unit: L/h
    conversion:
      method: unit_conversion
      formula: upper bound of reported clearance range (1.5 L/min) * 60 min/h
      assumptions:
        range_summary: upper_bound
        clearance_matrix: blood
        plasma_conversion: not_established
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports mean total clearance from blood of 1 to
      1.5 L/min after intravenous dosing; this supports a systemic CL interpretation.
      Clearance is used as a deterministic fixture model parameter and is not recalibrated
      to force agreement with terminal half-life.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: PubMed abstract
    exact_quote: Mean total clearance from the blood is 1 to 1.5 L/min
    selection:
      rule: upper_bound
      rationale: upper bound of reported clearance range (1.5 L/min) * 60 min/h Retained
        as an explicit legacy fixture choice, not a jointly fitted or clinically qualified
        parameter set.
  V_abs_L_at_70kg:
    source_id: source_2
    source_field: volume_of_distribution
    value_basis: derived_from_reported
    raw_value: 10.0
    raw_unit: L/kg
    normalized_value: 700.0
    normalized_unit: L
    conversion:
      method: body_weight_scaled
      formula: pk_parsed.volume.value * pk_parsed.weight_ref_kg_for_abs
      assumptions:
        weight_ref_kg_for_abs: 70.0
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports felodipine volume of distribution of about
      10 L/kg. Volume is retained as the one-compartment fixture volume and is not
      recalibrated to force agreement with terminal half-life.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: PubMed abstract
    exact_quote: The volume of distribution of felodipine is about 10 L/kg
    selection:
      rule: recorded_point_value
      rationale: pk_parsed.volume.value * pk_parsed.weight_ref_kg_for_abs
  bioavailability_frac:
    source_id: source_2
    source_field: oral_systemic_bioavailability
    value_basis: literature_reported
    raw_value: 15
    raw_unit: percent
    normalized_value: 0.15
    normalized_unit: fraction
    conversion:
      method: unit_conversion
      formula: 15 percent / 100
      assumptions:
        population_context: clinical_pharmacokinetic_summary
        route_context: oral
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports that first-pass degradation reduces the
      amount reaching systemic circulation to about 15%. The fixture uses this oral
      systemic availability with IV-derived systemic CL/V.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: PubMed abstract
    exact_quote: the amount reaching the systemic circulation is reduced to about
      15%
    selection:
      rule: recorded_point_value
      rationale: 15 percent / 100
  t_half_h:
    source_id: source_2
    source_field: mean_elimination_half_life
    value_basis: derived_from_reported
    raw_value: approximately 25
    raw_unit: h
    normalized_value: 24.5
    normalized_unit: h
    conversion:
      method: derived_formula
      formula: fixture midpoint of local 24-25 h range, source-confirmed as approximately
        25 h
      assumptions:
        source_precision: approximate
        range_summary: midpoint
    role: check_only
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports felodipine mean elimination half-life of
      approximately 25 h. Canonical t_half_h retains the fixture midpoint of the local
      24-25 h range and remains a check target only. CL and V are not jointly calibrated
      to match terminal half-life in this deterministic one-compartment fixture.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: PubMed abstract
    exact_quote: The mean elimination half-life of felodipine is approximately 25h.
    selection:
      rule: legacy_fixture_value
      rationale: fixture midpoint of local 24-25 h range, source-confirmed as approximately
        25 h Retained as an explicit legacy fixture choice, not a jointly fitted or
        clinically qualified parameter set. The source reports approximately 25 h,
        not an exact 24.5 h; 24-25 h is the older local summary.
simulation_validity:
  status: clinical_hold
  reasons:
  - The source reports blood clearance, but this fixture projects plasma concentrations
    without a verified blood-to-plasma conversion.
fixture_limitations:
- code: blood_plasma_matrix_unresolved
  statement: The source review reports total blood clearance 1-1.5 L/min, whereas
    the fixture is interpreted as plasma concentration. The retained 90 L/h is the
    upper blood-clearance bound, not a verified plasma clearance. No blood/plasma
    ratio has been established for conversion.
  source_id: source_2
  source_locator: Abstract, total clearance from blood and three-phase plasma decline
  checked_date: '2026-10-28'
