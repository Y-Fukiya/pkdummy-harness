    source_field: terminal_half_life_range
    value_basis: derived_from_reported
    raw_value: 3-7
    raw_unit: h
    normalized_value: 5.0
    normalized_unit: h
    conversion:
      method: derived_formula
      formula: midpoint of reported terminal half-life range (3 to 7 h)
      assumptions:
        range_summary: midpoint
    role: check_only
    reviewer_status: checked
    reviewer_note: DailyMed source_1 reports clarithromycin elimination half-life
      of about 3 to 4 h with 250 mg q12h and 5 to 7 h with 500 mg q8-12h. Canonical
      t_half_h retains the fixture midpoint of the source range and remains a check
      target only. CL and V are not jointly calibrated to match terminal half-life
      in this deterministic one-compartment fixture.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Metabolism and Elimination section
    exact_quote: "The elimination half-life of clarithromycin was about 3 hours to 4 hours"
