      assumptions: {}
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports mean adult total body clearance of 29.2
      to 58.1 L/h. The fixture uses the upper bound as apparent CL/F and does not
      treat this range as an individual estimate.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: PubMed abstract
    exact_quote: "total body clearance and renal clearance in adults have ranged from 29.2 to 58.1 L/h and 6.7 to 12.8 L/h, respectively."
