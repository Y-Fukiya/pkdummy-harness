    normalized_unit: L
    conversion:
      method: direct
      formula: pk_parsed.volume.value
      assumptions: {}
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: The primary PK modeling article in source_3 reports an apparent
      clarithromycin volume of distribution of 172 L. The fixture retains that apparent
      value and does not recalibrate it to the half-life range.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: Antimicrobial Agents and Chemotherapy, lines 165-166 / Table 1
    exact_quote: "the apparent volume of distribution of clarithromycin was 172 liters"
