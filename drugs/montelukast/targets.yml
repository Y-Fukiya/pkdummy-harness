scenario:
  purpose: computational_stress_test
  clinical_dose_verified: false
  id: montelukast_dose100mg_po_single
  route: po
  regimen: single
  dose:
    value: 100.0
    unit: mg
  population:
    species: human
    group: elderly_healthy
    parameter_source: source_1, elderly IV and oral comparison
targets:
  auc:
    type: AUC0-inf
    value: 33008.658008658014
    unit: ng*h/mL
    summary: fixture_consistency_check
    variability:
      type: gcv_percent
      value: 35
    basis: f_dose_over_cl
    target_basis: f_dose_over_cl_systemic_not_literature_auc
    independent_literature_target: false
    source_value: CL_systemic_L_per_h_at_70kg
    bioavailability_frac: 0.61
    role: consistency_check
  t_half:
    phase: terminal
    value: 6.7
    unit: h
    summary: arithmetic_mean
    variability:
      type: sd
      value: 1.675
    role: check_only
    used_to_calibrate_cl_v: false
    structural_mismatch:
      acknowledged: true
      reason: one_compartment_fixture_approximation
notes:
- Variability fields are placeholders unless you replace them with drug-specific PopPK values.
- 'Parameter-pair policy: spec theta uses CL and V from pk.yml derived absolute values as the independent
  simulation parameters. The literature t_half is retained as a target/check and is not used to recalibrate
  CL or V automatically.'
- 'Known 1-compartment attainability issue: CL/V-implied t_half differs from pk_parsed.half_life_h beyond
  the library warning threshold. t_half WARN/FAILED in demo validation may be expected and this drug can
  be used as a stress-test fixture.'
- AUC is computed as F*Dose/CL_systemic and is a fixture consistency check, not an independent literature
  AUC.
- Parameter-source population is healthy elderly volunteers, N=12, from source_1. CL30.8 mL/min, Vss9.7
  L and terminal half-life6.7 h followed7 mg IV over5 min. These are not the general healthy-young-adult
  label values.
- F1=0.61 is the elderly mean after10 mg oral; the prior0.615 mixed elderly61% with a previously measured
  young-subject62%. Do not replace elderly CL/t_half with a different population label value.
- The retained100 mg oral arm is a computational stress test, not the cited10 mg oral or7 mg IV scenario.
  The generated body-weight distribution does not reconstruct the elderly cohort. KA, lag, IIV and residual
  errors remain generic fixture assumptions.
provenance_review:
  status: acknowledged_fixture_limitation
  reviewer_note: The reported half-life remains check-only. CL and Vss are not recalibrated to force the
    terminal half-life into a one-compartment model.
  reviewed_fields:
  - CL
  - V
  - t_half
