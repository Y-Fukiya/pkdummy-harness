version: 0.1
study:
  id: OSP_montelukast
  title: Montelukast (template from label/PopPK summary)
population:
  n: 100
  covariates:
    wt_kg:
      dist: lognormal
      median: 70.0
      cv: 0.25
      min: 40
      max: 120
  parameter_source_group: elderly_healthy
regimen:
  route: oral
  units:
    dose: mg
  arms:
    A:
      n: 100
      dose_mg: 100
sampling:
  t_end_h: 72.0
  dt_h: 0.5
  include_t0: true
model:
  template: pk1_oral_ode
  units:
    conc: ng/mL
    mult: 1000
  theta:
    CL: 1.8479999999999999
    V: 9.7
    KA: 1.2
    F1: 0.61
    ALAG1: 0.5
  notes:
  - 'Systemic CL/V parameterization: theta.F1 is the selected bioavailability; exposure is F*Dose/CL_systemic.'
  - 'Demo theta policy: CL and V are the independent simulation parameters for this 1-compartment fixture.
    t_half is checked downstream and is not used to recalibrate theta.'
  - 'Known stress-test label: library validation flags CL/V/t_half structural mismatch for this drug,
    so terminal t_half WARN/FAILED can be expected in demo validation.'
  - Parameter-source population is healthy elderly volunteers, N=12, from source_1. CL30.8 mL/min, Vss9.7
    L and terminal half-life6.7 h followed7 mg IV over5 min. These are not the general healthy-young-adult
    label values.
  - F1=0.61 is the elderly mean after10 mg oral; the prior0.615 mixed elderly61% with a previously measured
    young-subject62%. Do not replace elderly CL/t_half with a different population label value.
  - The retained100 mg oral arm is a computational stress test, not the cited10 mg oral or7 mg IV scenario.
    The generated body-weight distribution does not reconstruct the elderly cohort. KA, lag, IIV and residual
    errors remain generic fixture assumptions.
iiv:
  eta:
    CL: 0.09
    V: 0.04
    KA: 0.16
  corr: false
residual:
  type: prop+add
  prop: 0.25
  add: 0.0
output:
  out_dir: outputs
  seed: 20260217
  write:
    raw_csv: true
    nonmem_csv: true
    summary_md: true
meta:
  sources:
  - https://pubmed.ncbi.nlm.nih.gov/9429741/
  pk_summary_raw:
    half_life: 6.7 hours
    clearance: 30.8 mL/min
    volume: 9.7 L
    bioavailability: 61-62%
    elimination: 胆汁排泄
