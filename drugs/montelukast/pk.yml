simulation_validity:
  source_correction_date: '2026-10-28'
  status: clinical_hold
  review_date: '2026-10-28'
  correction_notes:
  - F was corrected from 0.615, an average of elderly and young-subject estimates,
    to the elderly mean of 0.61 in source_1. With systemic CL and V, F1 was changed
    from 1.0 to 0.61. The elderly CL, Vss and terminal half-life values were retained.
  reasons:
  - CL 30.8 mL/min, Vss 9.7 L and terminal half-life 6.7 h come from 12 healthy
    elderly volunteers after 7 mg IV over 5 min in source_1. Oral F 0.61 comes from
    10 mg in that population. These inputs do not reconstruct a general healthy-young-adult
    model, and the generated body-weight distribution does not reconstruct the elderly
    cohort.
  - The one-compartment model using the retained CL and V does not reproduce the
    reported terminal half-life. KA, lag, IIV and residual errors are generic fixture
    assumptions.
  - The 100 mg oral arm is a computational stress test, not the source study's 10 mg
    oral or 7 mg IV scenario. The model has not been qualified for this extrapolation
    against independent concentration-time data.
