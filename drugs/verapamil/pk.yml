    source_field: oral_absolute_bioavailability
    value_basis: literature_reported
    raw_value: 22.47
    raw_unit: percent
    normalized_value: 0.2247
    normalized_unit: fraction
    conversion:
      method: unit_conversion
      formula: 22.47 percent / 100
      assumptions:
        population_context: six_healthy_subjects
        dose_context: 120 mg oral compared with 10 mg IV
        formulation_context: immediate_release_oral
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_3 reports mean oral bioavailability of 22.47% in
