    normalized_value: 30.0384
    normalized_unit: L/h
    conversion:
      method: unit_conversion
      formula: 500.64 mL/min * 60 min/h / 1000 mL/L
      assumptions:
        route_context: IV_healthy_subjects
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_3 reports mean IV body clearance 500.64 mL/min in
      six healthy subjects. The canonical value is the direct unit conversion and
      is systemic CL, not oral CL/F.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: PubMed abstract
    exact_quote: body clearance (C1b) showed 500.64 ml/min
