        or clinically qualified parameter set.
simulation_validity:
  status: not_assessed
  reasons: []
fixture_limitations:
- code: first_pass_and_repeat_dosing
  statement: The label describes extensive first-pass metabolism, a nonlinear dose-concentration
    relationship and a longer half-life with repeated dosing. A single fixed CL/V/F
    does not express these changes.
  source_id: source_1
  source_locator: CLINICAL PHARMACOLOGY, Pharmacokinetics and metabolism
  checked_date: '2026-10-28'
- code: stereoselective_first_pass
  statement: Human data demonstrate stereoselective first-pass metabolism. This racemic
    single-compartment fixture does not separate R/S enantiomers or their different
    oral disposition.
  source_id: source_4
  source_locator: Abstract
  checked_date: '2026-10-28'
