    raw_value: 2.51
    raw_unit: L/kg
    normalized_value: 175.7
    normalized_unit: L
    conversion:
      method: body_weight_scaled
      formula: 2.51 L/kg * 70 kg
      assumptions:
        route_context: IV_healthy_subjects
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_3 reports IV Vd(area) 2.51 L/kg in six healthy subjects.
      The canonical value is scaled to 70 kg and is a cross-route systemic fixture
