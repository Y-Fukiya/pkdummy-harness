id: OSP_fluconazole
name: Fluconazole
route_inferred: iv
sources:
- id: source_1
  url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f6e44764-c652-4926-b081-9111c82c7957
pk_raw:
  text: 'Label: mean body clearance 0.23 mL/min/kg; t1/2 ~30 h. One-comp V derived.'
pk_parsed:
  half_life_h: 30.0
  clearance:
    value: 0.0138
    unit: L/h/kg
  volume:
    value: 0.5972757469280309
    unit: L/kg
  bioavailability_frac: 1.0
  clearance_basis: systemic
  volume_basis: systemic
  weight_ref_kg_for_abs: 70.0
derived:
  ke_1_per_h: 0.023104906018664845
  CL_abs_L_per_h_at_70kg: 0.966
  V_abs_L_at_70kg: 41.80930228496216
  CL_apparent_L_per_h_at_70kg: 0.966
  V_apparent_L_at_70kg: 41.80930228496216
  CL_systemic_L_per_h_at_70kg: 0.966
  V_systemic_L_at_70kg: 41.80930228496216
  notes:
  - Apparent CL/V were derived as (systemic CL/V) / F.
  - 'Basis detected/selected: systemic (CL, V). Oral models typically use F1=bioavailability
    with systemic CL/V.'
  - 'Reminder: Oral labels often report apparent parameters (CL/F, V/F). IV labels
    typically report systemic parameters.'
value_provenance:
  CL_abs_L_per_h_at_70kg:
    source_id: source_1
    source_field: mean_body_clearance_in_adults
    value_basis: derived_from_reported
    raw_value: 0.23
    raw_unit: mL/min/kg
    normalized_value: 0.966
    normalized_unit: L/h
    conversion:
      method: unit_conversion_and_body_weight_scaling
      formula: 0.23 mL/min/kg * 60 min/h / 1000 mL/L * 70 kg
      assumptions:
        weight_ref_kg_for_abs: 70.0
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: DailyMed source_1 reports mean adult body clearance of 0.23 mL/min/kg.
      The fixture scales this systemic IV/whole-body clearance reference to 70 kg.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: DailyMed label, Clinical Pharmacology, Pharmacokinetics and Metabolism
    exact_quote: Mean body clearance in adults is reported to be 0.23 (17%) mL/min/kg
    selection:
      rule: recorded_point_value
      rationale: 0.23 mL/min/kg * 60 min/h / 1000 mL/L * 70 kg
  V_abs_L_at_70kg:
    source_id: source_1
    source_field: one_compartment_volume_derived_from_clearance_and_half_life
    value_basis: fixture_derived
    raw_value: 0.23 and 30.0
    raw_unit: mL/min/kg and h
    normalized_value: 41.80930228496216
    normalized_unit: L
    conversion:
      method: derived_formula
      formula: CL_abs_L_per_h_at_70kg * t_half_h / ln(2)
      assumptions:
        model: one_compartment_fixture
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: The label states that fluconazole Vd approximates total body water
      but does not supply the fixture's exact V. The committed V is explicitly derived
      from the checked CL and half-life for the one-compartment fixture.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    selection:
      rule: derived_value
      rationale: CL_abs_L_per_h_at_70kg * t_half_h / ln(2)
      depends_on:
      - CL_abs_L_per_h_at_70kg
      - t_half_h
  t_half_h:
    source_id: source_1
    source_field: terminal_plasma_half_life_in_normal_volunteers
    value_basis: label_reported
    raw_value: 30.0
    raw_unit: h
    normalized_value: 30.0
    normalized_unit: h
    conversion:
      method: direct
      formula: pk_parsed.half_life_h
      assumptions: {}
    role: check_only
    reviewer_status: checked
    reviewer_note: DailyMed source_1 reports an approximate terminal plasma half-life
      of 30 h after oral administration in normal volunteers. It remains a check target
      for the derived V.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Clinical Pharmacology, Pharmacokinetics and Metabolism
    exact_quote: terminal plasma elimination half-life of approximately 30 hours
    selection:
      rule: recorded_point_value
      rationale: pk_parsed.half_life_h
simulation_validity:
  status: not_assessed
  reasons: []
