version: 0.1
study:
  id: OSP_moclobemide
  title: Moclobemide (template from label/PopPK summary)
population:
  n: 100
  covariates:
    wt_kg:
      dist: lognormal
      median: 70.0
      cv: 0.25
      min: 40
      max: 120
regimen:
  route: oral
  units:
    dose: mg
  arms:
    A:
      n: 100
      dose_mg: 100
sampling:
  t_end_h: 72.0
  dt_h: 0.5
  include_t0: true
model:
  template: pk1_oral_ode
  units:
    conc: ng/mL
    mult: 1000
  theta:
    CL: 39.4
    V: 84.3
    KA: 1.2
    F1: 0.56
    ALAG1: 0.5
  notes:
  - CL and V are systemic values from the primary IV first-infusion context; theta.F1=0.56
    represents the first-dose oral bioavailability reported in the same study.
  - The source reports route- and exposure-dependent kinetics. This is a cross-route
    fixture parameterization, not a clinical oral dosing model.
  - 'Demo theta policy: CL and V are the independent simulation parameters for this
    1-compartment fixture. t_half is checked downstream and is not used to recalibrate
    theta.'
  - 'Known stress-test label: library validation flags CL/V/t_half structural mismatch
    for this drug, so terminal t_half WARN/FAILED can be expected in demo validation.'
iiv:
  eta:
    CL: 0.09
    V: 0.04
    KA: 0.16
  corr: false
residual:
  type: prop+add
  prop: 0.25
  add: 0.0
output:
  out_dir: outputs
  seed: 20260217
  write:
    raw_csv: true
    nonmem_csv: true
    summary_md: true
meta:
  sources:
  - https://go.drugbank.com/drugs/DB01171
  - https://pubmed.ncbi.nlm.nih.gov/2248087/
  - https://pubmed.ncbi.nlm.nih.gov/8582117/
  pk_summary_raw:
    half_life: 1-2 hours
    clearance: 30-78 L/h
    volume: 1-1.5 L/kg
    bioavailability: 56-90%
    elimination: 肝代謝+腎排泄
