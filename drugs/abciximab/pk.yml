simulation_validity:
  status: clinical_hold
  reasons:
  - Free plasma drug has multiphasic disposition, while platelet-bound drug persists
    much longer. This fixed linear one-compartment fixture does not distinguish the
    free and platelet-bound pools.
  - The adopted clearance, volume and short plasma half-life come from different studies,
    populations and summaries; they are not a jointly estimated parameter set.
fixture_limitations:
- code: free_vs_platelet_bound_disposition
  statement: The historical FDA label reports rapid loss of free plasma abciximab,
    with an initial half-life below 10 min and a second phase of about 30 min, while
    platelet-bound drug remains for 15 days or longer. The label relates rapid plasma
    decline to platelet GPIIb/IIIa binding. The linear one-compartment fixture does
    not distinguish these pools or establish a validated target-mediated disposition
    model.
  source_id: source_7
  source_locator: FDA ReoPro label, 2013, printed page 2, Clinical Pharmacology, Pharmacokinetics
  checked_date: '2026-10-28'
