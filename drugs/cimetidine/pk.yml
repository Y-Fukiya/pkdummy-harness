id: osp::cimetidine
name: Cimetidine
route_inferred: po
sources:
- id: source_1
  url: https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=496e258d-a5fd-42da-9a86-73afc8be359b
- id: source_2
  url: https://pubmed.ncbi.nlm.nih.gov/7363531/
pk_raw:
  half_life: 2 hours
  clearance: 500 mL/min
  volume_of_distribution: 0.8 L/kg
  bioavailability: about 60% in the selected ulcer-patient IV/oral study; 60-70% retained as broader context
  elimination_route: 腎排泄
pk_parsed:
  half_life_h: 2.0
  half_life_h_range:
  - 2.0
  - 2.0
  clearance:
    value: 29.7
    unit: L/h
  volume:
    value: 0.8
    unit: L/kg
  bioavailability_frac: 0.6
  weight_ref_kg_for_abs: 70.0
  clearance_basis: systemic
  volume_basis: systemic
  clearance_basis_source: primary_source_reviewed
  clearance_basis_note: 'Systemic basis and parsed clearance reviewed against PubMed
    source_2: the IV/oral bioavailability study reports plasma clearance of 495 mL/min
    and Vss about 0.8 L/kg. pk_raw retains the original 500 mL/min summary text, while
    pk_parsed and derived use the exact source value 495 mL/min = 29.7 L/h.'
derived:
  ke_1_per_h: 0.5303571428571429
  CL_abs_L_per_h_at_70kg: 29.7
  V_abs_L_at_70kg: 56.0
  CL_apparent_L_per_h_at_70kg: 49.5
  V_apparent_L_at_70kg: 93.33333333333333
  CL_systemic_L_per_h_at_70kg: 29.7
  V_systemic_L_at_70kg: 56.0
  notes:
  - Apparent CL/V were derived as (systemic CL/V) / F.
  - 'Basis detected/selected: systemic (CL, V). Oral models typically use F1=bioavailability
    with systemic CL/V.'
  - 'Reminder: Oral labels often report apparent parameters (CL/F, V/F). IV labels
    typically report systemic parameters.'
value_provenance:
  CL_abs_L_per_h_at_70kg:
    source_id: source_2
    source_field: plasma_clearance
    value_basis: literature_reported
    raw_value: 495
    raw_unit: mL/min
    normalized_value: 29.7
    normalized_unit: L/h
    conversion:
      method: unit_conversion
      formula: 495 mL/min * 60 min/h / 1000 mL/L
      assumptions: {}
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports plasma clearance of 495 mL/min after the
      IV/oral bioavailability study. The canonical parsed value corrects the legacy
      rounded 500 mL/min summary to the source value and is not recalibrated to force
      agreement with terminal half-life.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: PubMed abstract
    exact_quote: "the plasma clearance value of 495 ml/min"
  V_abs_L_at_70kg:
    source_id: source_2
    source_field: apparent_volume_of_distribution_at_steady_state
    value_basis: literature_reported
    raw_value: 0.8
    raw_unit: L/kg
    normalized_value: 56.0
    normalized_unit: L
    conversion:
      method: body_weight_scaled
      formula: pk_parsed.volume.value * pk_parsed.weight_ref_kg_for_abs
      assumptions:
        weight_ref_kg_for_abs: 70.0
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports an apparent volume of distribution at steady
      state of about 0.8 L/kg after an IV/oral bioavailability study. The value is
      scaled to the repository's explicit 70 kg fixture reference and is not recalibrated
      to force agreement with terminal half-life.
    source_review_status: checked
    fixture_limitation_status: not_applicable
    source_locator: PubMed abstract
    exact_quote: "The volume of distribution at steady-state was about 80% of body weight"
  bioavailability_frac:
    source_id: source_2
    source_field: absolute_oral_bioavailability
    value_basis: literature_reported
    raw_value: 60
    raw_unit: percent
    normalized_value: 0.6
    normalized_unit: fraction
    conversion:
      method: unit_conversion
      formula: 60 percent / 100
      assumptions:
        population_context: gastric_and_duodenal_ulcer_patients
        dose_context: 200 mg IV and oral
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 reports about 60% absolute bioavailability in 6 gastric and 6 duodenal ulcer patients aged 28 to 64 years after 200 mg IV and oral dosing. The selected F follows this primary-study context; the broader 60-70% summary is not treated as a single observed value.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: PubMed abstract
    exact_quote: "Bioavailability was not complete, but was about 60%"
  t_half_h:
    source_id: source_1
    source_field: terminal_half_life
    value_basis: label_reported
    raw_value: 2.0
    raw_unit: h
    normalized_value: 2.0
    normalized_unit: h
    conversion:
      method: direct
      formula: pk_parsed.half_life_h
      assumptions: {}
    role: check_only
    reviewer_status: checked
    reviewer_note: DailyMed source_1 reports cimetidine half-life as approximately
      2 h. Canonical t_half_h remains a check target only. CL and V are not jointly
      calibrated to match terminal half-life in this deterministic one-compartment
      fixture.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Pharmacokinetics section
    exact_quote: "The half-life of cimetidine is approximately 2 hours."
