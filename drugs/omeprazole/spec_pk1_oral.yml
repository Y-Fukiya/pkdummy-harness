version: 0.1
study:
  id: OSP_omeprazole
  title: Omeprazole (template from label/PopPK summary)
population:
  n: 100
  covariates:
    wt_kg:
      dist: lognormal
      median: 70.0
      cv: 0.25
      min: 40
      max: 120
regimen:
  route: oral
  units:
    dose: mg
  arms:
    A:
      n: 100
      dose_mg: 100
sampling:
  t_end_h: 72.0
  dt_h: 0.1
  include_t0: true
model:
  template: pk1_oral_ode
  units:
    conc: ng/mL
    mult: 1000
  theta:
    CL: 37.44
    V: 16.1
    KA: 1.2
    F1: 0.35
    ALAG1: 0.5
  notes:
  - 'Systemic CL/V parameterization: theta.F1 is the selected bioavailability; exposure is F*Dose/CL_systemic.'
  - F1=0.35 is the midpoint of the healthy-subject 30-40% label range at 20-40 mg; the 100 mg arm is a
    fixture stress test, not a clinical dose-exposure assertion.
  - 'Demo theta policy: CL and V are the independent simulation parameters for this 1-compartment fixture.
    t_half is checked downstream and is not used to recalibrate theta.'
  - 'Known stress-test label: library validation flags CL/V/t_half structural mismatch for this drug,
    so terminal t_half WARN/FAILED can be expected in demo validation.'
  - CL=37.44 L/h is 624 mL/min * 60/1000 from the source_4 median. V=16.1 L is the source_4 mean IV Vss
    0.23 L/kg * 70 kg; median CL and mean Vss are different summary statistics.
  - F1=0.35 and half-life 0.75 h are midpoint fixture selections from the healthy-subject label ranges,
    not the PubMed study median F=39% or its IV half-life. The retained 100 mg dose is a stress-test fixture,
    not a validated 20 mg oral buffered-solution scenario.
  - Legacy pk_raw volume 0.4 L/kg is retained as the original capture; the adopted source_4 IV Vss is
    0.23 L/kg. KA, lag, IIV and residual errors remain generic fixture assumptions.
iiv:
  eta:
    CL: 0.09
    V: 0.04
    KA: 0.16
  corr: false
residual:
  type: prop+add
  prop: 0.25
  add: 0.0
output:
  out_dir: outputs
  seed: 20260217
  write:
    raw_csv: true
    nonmem_csv: true
    summary_md: true
meta:
  sources:
  - https://en.wikipedia.org/wiki/Omeprazole
  - https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d8b466e0-a35e-4fba-9d43-4e6c0122e7ad
  - https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=a17e415e-a559-4a8d-a455-699184a01523
  - https://pubmed.ncbi.nlm.nih.gov/2315973/
  pk_summary_raw:
    half_life: 0.5-1 hours
    clearance: 624 mL/min (range 59-828 mL/min)
    volume: 0.4 L/kg
    bioavailability: about 30-40% at 20-40 mg in healthy subjects; 58% in young and 76% in elderly volunteers
      after a 40 mg buffered solution
    elimination: Hepatic metabolism (CYP2C19, CYP3A4); about 77% recovered in urine as metabolites, with
      little if any unchanged drug; remaining dose recovered in feces.
