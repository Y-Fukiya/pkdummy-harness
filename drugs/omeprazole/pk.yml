simulation_validity:
  source_correction_date: '2026-10-28'
  status: clinical_hold
  review_date: '2026-10-28'
  correction_notes:
  - Systemic CL was corrected from 43.56 to 37.44 L/h using the source_4 median
    of 624 mL/min and the conversion 624 * 60 / 1000.
  - The adopted V is the source_4 mean IV Vss of 0.23 L/kg, scaled to 16.1 L at
    70 kg. The legacy pk_raw volume of 0.4 L/kg is retained as the original capture.
  - The elimination-route description was corrected to distinguish hepatic metabolism
    from urinary recovery of metabolites.
  reasons:
  - The selected CL of 37.44 L/h and V of 16.1 L combine a median systemic CL with
    a mean IV Vss from source_4. These different summary statistics are not a jointly
    estimated one-compartment parameter set.
  - F1 of 0.35 and half-life of 0.75 h are midpoint fixture selections from separate
    healthy-subject label ranges. They are not the study's median F of 39% or its
    IV half-life, and the retained CL and V do not reproduce the selected half-life.
  - The 100 mg computational regimen has not been qualified for extrapolation from
    the 20 mg oral buffered-solution study. KA, lag, IIV and residual errors remain
    generic fixture assumptions.
