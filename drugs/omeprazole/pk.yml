pk_raw:
  half_life: 0.5-1 hours
  clearance: 624 mL/min (range 59-828 mL/min)
  volume_of_distribution: 0.4 L/kg
  bioavailability: about 30-40% at 20-40 mg in healthy subjects; 58% in young and
    76% in elderly volunteers after a 40 mg buffered solution
  elimination_route: Hepatic metabolism (CYP2C19, CYP3A4); about 77% recovered in
    urine as metabolites, with little if any unchanged drug; remaining dose recovered
    in feces.
