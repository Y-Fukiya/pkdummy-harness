    source_field: oral_clearance_after_single_1_mg_dose
    value_basis: derived_from_reported
    raw_value: 1.5
    raw_unit: mL/min/kg
    normalized_value: 6.3
    normalized_unit: L/h
    conversion:
      method: unit_conversion_and_body_weight_scaling
      formula: 1.5 mL/min/kg * 60 min/h / 1000 mL/L * 70 kg
      assumptions:
        range_summary: upper_bound
        weight_ref_kg_for_abs: 70.0
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_1 reports oral alprazolam clearance of 0.7 to 1.5
      mL/min/kg after a single 1 mg dose. The fixture deliberately uses the upper
      bound and retains it as apparent CL/F; systemic CL is not identified from this
      oral summary alone.
