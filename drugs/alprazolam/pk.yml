    raw_unit: L/kg
    normalized_value: 91.0
    normalized_unit: L
    conversion:
      method: body_weight_scaled
      formula: 1.3 L/kg * 70 kg
      assumptions:
        range_summary: upper_bound
        weight_ref_kg_for_abs: 70.0
