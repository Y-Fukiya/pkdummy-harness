pk_raw:
  half_life: 3-7 hours
  clearance: 48 L/h
  volume_of_distribution: null
  bioavailability: 約50%
  elimination_route: 肝代謝
pk_parsed:
  half_life_h: 5.0
  half_life_h_range:
  - 3.0
  - 7.0
  clearance:
    value: 48.0
    unit: L/h
  volume:
    value: 346.2468098133512
    unit: L
    derived_from: clearance and half_life_h assuming ke=ln(2)/t1/2
  bioavailability_frac: 0.5
  bioavailability_frac_range:
  - 0.5
  - 0.5
  weight_ref_kg_for_abs: 70.0
  clearance_basis: systemic
  volume_basis: systemic
