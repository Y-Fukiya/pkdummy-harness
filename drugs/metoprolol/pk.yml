derived:
  ke_1_per_h: 0.13862943611198908
  CL_abs_L_per_h_at_70kg: 48.0
  V_abs_L_at_70kg: 346.2468098133512
  CL_apparent_L_per_h_at_70kg: 96.0
  V_apparent_L_at_70kg: 692.4936196267024
  CL_systemic_L_per_h_at_70kg: 48.0
  V_systemic_L_at_70kg: 346.2468098133512
  notes:
  - Apparent CL/V were derived as (systemic CL/V) / F.
  - 'Basis detected/selected: systemic (CL, V). Oral models typically use F1=bioavailability
    with systemic CL/V.'
  - 'Reminder: Oral labels often report apparent parameters (CL/F, V/F). IV labels
    typically report systemic parameters.'
value_provenance:
  CL_abs_L_per_h_at_70kg:
    source_id: source_2
    source_field: IV_total_clearance_in_healthy_subjects
    value_basis: literature_reported
    raw_value: 0.8
    raw_unit: L/min
    normalized_value: 48.0
    normalized_unit: L/h
    conversion:
      method: unit_conversion
      formula: 0.8 L/min * 60 min/h
      assumptions:
        route_context: IV
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: PubMed source_2 is a primary IV/oral study in healthy subjects and reports total body clearance of 0.8 +/- 0.1 L/min after 20 mg IV. The canonical value is the direct unit conversion to 48 L/h; it is not an oral CL/F value.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: PubMed abstract
    exact_quote: "Total body clearance in the healthy subjects was 0.8 +/- 0.1 L/min"
  V_abs_L_at_70kg:
    source_id: source_1
    source_field: one_compartment_volume_from_systemic_CL_and_representative_half_life
    value_basis: derived_from_reported
    raw_value: 346.2468098133512
    raw_unit: L
    normalized_value: 346.2468098133512
    normalized_unit: L
    conversion:
      method: derived_formula
      formula: CL_abs_L_per_h_at_70kg * half_life_h / ln(2)
      assumptions:
        source_reported_volume_range_L_per_kg:
        - 3.2
        - 5.6
        weight_ref_kg_for_abs: 70.0
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: DailyMed source_1 reports Vd 3.2-5.6 L/kg (224-392 L at the repository's
      70 kg reference), which brackets the committed fixture V. The exact one-compartment
      value is derived, not directly reported.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Clinical Pharmacokinetics, Distribution
    exact_quote: "Vd 3.2-5.6 L/kg"
  bioavailability_frac:
    source_id: source_1
    source_field: conventional_oral_bioavailability_relative_to_iv
    value_basis: literature_reported
    raw_value: 50
    raw_unit: percent
    normalized_value: 0.5
    normalized_unit: fraction
    conversion:
      method: unit_conversion
      formula: 50 percent / 100
      assumptions:
        formulation_context: conventional_immediate_release_metoprolol
        comparison: oral_peak_relative_to_iv_peak
    role: simulation_parameter
    reviewer_status: checked
    reviewer_note: DailyMed source_1 states that conventional oral metoprolol peak levels approximate 50% of IV levels, indicating about 50% first-pass metabolism. This is not the 77% relative bioavailability reported for the extended-release formulation in the same label; the fixture selects conventional oral F.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Clinical Pharmacokinetics, Absorption
    exact_quote: "conventional metoprolol tablets, however, approximate 50% of levels following intravenous administration"
  t_half_h:
    source_id: source_1
    source_field: mean_elimination_half_life
    value_basis: derived_from_reported
    raw_value: 5.0
    raw_unit: h
    normalized_value: 5.0
    normalized_unit: h
    conversion:
      method: midpoint_of_reported_range
      formula: (3 h + 7 h) / 2
      assumptions:
        raw_range_context: repository_raw_summary_3_to_7_h
    role: check_only
    reviewer_status: checked
    reviewer_note: The repository retains the existing 3-7 h summary and uses its
      midpoint only as a deterministic fixture representative. The current DailyMed
      label separately reports 3-4 h in usual subjects and 7-9 h in poor CYP2D6 metabolizers,
      so this midpoint must not be read as a directly observed population mean.
    source_review_status: checked
    fixture_limitation_status: acknowledged
    source_locator: DailyMed label, Clinical Pharmacokinetics, Elimination
    exact_quote: "the plasma half-life ranges from approximately 3 to 7 hours"
