scenario:
  id: metoprolol_dose100mg_po_single
  route: po
  regimen: single
  dose:
    value: 100.0
    unit: mg
  population:
    species: human
    group: adult_healthy
targets:
  auc:
    type: AUC0-inf
    value: 1041.6666666666667
    unit: ng*h/mL
    summary: geometric_mean
    variability:
      type: gcv_percent
      value: 35
    basis: f_dose_over_cl
    target_basis: f_dose_over_cl_systemic_not_literature_auc
    bioavailability_frac: 0.5
    independent_literature_target: false
    source_value: CL_systemic_L_per_h_at_70kg
    role: consistency_check
  t_half:
    phase: terminal
    value: 5.0
    unit: h
    summary: arithmetic_mean
    variability:
      type: sd
      value: 1.0
    role: check_only
    used_to_calibrate_cl_v: false
    structural_mismatch:
      acknowledged: false
      reason: null
notes:
- AUC is computed as F*Dose/CL_systemic because source_2's 48 L/h is an IV/systemic
  clearance and source_1 reports oral F approximately 50%.
- Variability fields are placeholders unless you replace them with drug-specific PopPK
  values.
- 'AUC target provenance: computed as Dose/CL from the extracted CL used by this fixture.
  It is an integration consistency check, not an independent literature AUC or clinical
  validity claim. To validate against a literature AUC, replace targets.auc.value/unit/summary
  and add the source, raw text, unit conversion, and derivation note.'
- 'Parameter-pair policy: spec theta uses systemic CL and V from pk.yml as the independent
  simulation parameters. The representative t_half is retained as a check and is not
  used to claim a jointly validated one-compartment model.'
- '1-compartment attainability label: no CL/V/t_half warning is currently flagged
  by validate_library at the repository threshold. This is still a workflow-fixture
  label, not evidence of clinical model validity.'
