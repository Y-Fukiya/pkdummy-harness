scenario:
  purpose: computational_stress_test
  clinical_dose_verified: false
  id: raltegravir_dose400mg_po_single
  route: po
  regimen: single
  dose:
    value: 400.0
    unit: mg
  population:
    species: human
    group: adult_healthy
targets:
  auc:
    type: AUC0-inf
    value: 6644.518272425249
    unit: ng*h/mL
    summary: geometric_mean
    variability:
      type: gcv_percent
      value: 35
    basis: dose_over_cl
    target_basis: dose_over_cl_not_literature_auc
    independent_literature_target: false
    source_value: CL_abs_L_per_h_at_70kg
    role: consistency_check
  t_half:
    phase: terminal
    value: 7.8
    unit: h
    summary: arithmetic_mean
    variability:
      type: sd
      value: 1.0
    role: check_only
    used_to_calibrate_cl_v: false
    structural_mismatch:
      acknowledged: true
      reason: one_compartment_fixture_approximation
notes:
- AUC is computed as Dose/CL using the extracted CL. For oral, this is often apparent
  CL/F unless you explicitly choose systemic parameters.
- Variability fields are placeholders unless you replace them with drug-specific PopPK
  values.
- 'AUC target provenance: computed as Dose/CL from the extracted CL used by this fixture.
  It is an integration consistency check, not an independent literature AUC or clinical
  validity claim. To validate against a literature AUC, replace targets.auc.value/unit/summary
  and add the source, raw text, unit conversion, and derivation note.'
- 'Parameter-pair policy: spec theta uses CL and V from pk.yml derived absolute values
  as the independent simulation parameters. The literature t_half is retained as a
  target/check and is not used to recalibrate CL or V automatically.'
- 'Known 1-compartment attainability issue: source_1 is a two-compartment population
  PK analysis, while this repository derives a one-compartment V from CL/F and the
  selected terminal half-life. The mismatch is explicit and fixture-only.'
provenance_review:
  status: acknowledged_fixture_limitation
  reviewer_note: Source_1 reports a multicompartment oral CL/F context; the committed one-compartment V is a transparent derivation and is not jointly calibrated as a clinical model.
  reviewed_fields:
  - CL
  - V
  - t_half
